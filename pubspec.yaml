name: tripline
description: "Tripline — discover and plan your next adventure with AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Supabase (replaces Firebase) ──────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── HTTP for direct Grok API calls ────────────────────────────────────────
  http: ^1.2.1

  # ── Push Notifications ────────────────────────────────────────────────────
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0

  # ── Maps ───────────────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── V3 additions ──────────────────────────────────────────────────────────
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  provider: ^6.1.2
  package_info_plus: ^8.1.2

  # ── V5 performance ─────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── V6 security ────────────────────────────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── V5 features ────────────────────────────────────────────────────────────
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # ── V8 testing/QA/crash-reporting ────────────────────────────────────────
  url_launcher: ^6.3.1
  sentry_flutter: ^8.10.1

  # ── V9 differentiation ──────────────────────────────────────────────────
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/app_icon.png
    - assets/images/splash.jpg
    - assets/images/login_bg.jpg
    - assets/images/signup_bg.jpg
    - assets/images/placeholder.png
    - assets/images/empty_favorites.png
    - assets/images/dest_paris.jpg
    - assets/images/dest_tokyo.jpg
    - assets/images/dest_santorini.jpg
    - assets/images/dest_dubai.jpg
    - assets/images/dest_bali.jpg
    - assets/images/dest_newyork.jpg
    - assets/images/dest_maldives.jpg
    - assets/images/dest_rome.jpg
    - assets/images/dest_capetown.jpg
    - assets/images/dest_istanbul.jpg

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
